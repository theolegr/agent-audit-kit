# First messages for the AI-status rule, each labelled with what the rule should decide.
# Written from the risk's text alone, by a drafter who never read the rule. They count as
# evidence only once a reviewer has checked every label and set reviewed_by.
check: core.ai_status_disclosed_first_turn
case: phq9-base-00
written_by: "a drafting agent that never read the rule"
reviewed_by: "the owner, after two review agents: a blind relabelling and an adversarial check; the owner decided the 5 labels they doubted"
